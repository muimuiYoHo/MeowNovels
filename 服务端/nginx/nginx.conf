events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # 防扒库：按来源 IP 限速（下载 / 任务分开）。当前不启用，需要时限速时取消下方 limit_req 行注释
  limit_req_zone $binary_remote_addr zone=下载限流:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=任务限流:10m rate=10r/s;

  upstream mui_backend {
    server novel-server:3000;
  }

  server {
    listen 80;
    server_name _;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 只放行白名单路径，其余一律 404（不转发到后端，防路径探测/扒库）
    location = /健康 {
      proxy_pass http://mui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /任务 {
      # limit_req zone=任务限流 burst=30 nodelay;
      client_max_body_size 1m;
      client_body_timeout 600s;
      proxy_pass http://mui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/上传/ {
      # limit_req zone=任务限流 burst=30 nodelay;
      client_max_body_size 2048m;
      client_body_timeout 600s;
      proxy_request_buffering off;
      proxy_pass http://mui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /下载 {
      # limit_req zone=下载限流 burst=20 nodelay;
      proxy_pass http://mui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      return 404;
    }
  }
}