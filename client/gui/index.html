<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>喵小说</title>
    <!--
      首屏底色（内联在 head 里，**不依赖外链 CSS 加载**）：

      Vue 挂载前有一段空白期（dev 模式约 0.5s，生产构建会短得多）。
      那段时间 #app 是空的，露出的是浏览器默认的白色 —— 与应用的
      --页面底色(#F5F7F9) 反差明显，看起来像「白屏坏了」。涂上同色之后
      这段等待就变成「同色屏」，观感接近秒开。

      用 var(--页面底色, #f5f7f9) 而不是写死颜色：外链 CSS（颜色管理.*.css）
      载入后会自动接管成各平台自己的底色，两端共用同一个入口也不用分叉。
      ⚠️ 兜底值要和 src/styles/颜色管理.android.css 的 --中性-100 保持一致。
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: var(--页面底色, #f5f7f9);
      }
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
