[package]
name = "miao_novel"
version = "0.5.0"
description = "喵小说客户端"
authors = ["缪缪muimui"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 只为修一个上游兼容问题，本项目并不真正使用它：
# tauri-build → schemars 0.8.22 依赖 indexmap 1.9.3（2022 年的老版本）。
# indexmap 的 build.rs 只在 CARGO_FEATURE_STD 存在时才设置 has_std，
# 否则退化成 autocfg 探测，而该探测在当前环境失败 —— 于是它编译
# `#[cfg(not(has_std))] pub struct IndexMap<K, V, S>`（S 无默认值），
# 而 schemars 写的是 indexmap::IndexMap<K, V>，报 E0107。
#
# 必须写在 [build-dependencies]：schemars 是 build dependency，在 HOST 上编译，
# 用的是 host 侧独立的那份 indexmap；写进 [dependencies] 只会影响 target 依赖图，
# 对 host 编译毫无作用（已经踩过这个坑）。
indexmap = { version = "1.9.3", default-features = false, features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ── 原生网络层（书源系统的「发起网络请求」）─────────────────────────────
# 为什么必须有它：WebView 里 fetch 外站会被 CORS 拦（实测 `Failed to fetch`），
# 而书源要抓的是任意第三方站点，不可能让它们都配 CORS 头。
#
# · `rustls-tls`：安卓上**不能**用 native-tls（它走 OpenSSL，交叉编译地狱）。
# · `cookies`：reqwest 自带的 cookie jar，按域名隔离，登录态靠它。
# · 不开 `json` feature（我们只用 serde_json 手动拼，省一份依赖）。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
] }
# 原始字节要跨 IPC 回前端，base64 是唯一无损且不炸 JSON 的载体。
base64 = "0.22"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
sysinfo = "0.30"
# 把「初始数据」整棵树编译期嵌进二进制，运行时释放到私有空间。
# 不用 Tauri 的 bundle.resources：安卓上那套走 APK assets / JNI，路径语义和
# 普通文件系统不同，还要额外配 tauri.conf.json；嵌入则是纯 std::fs 写文件。
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry"
] }

# Android 的 debug 构建默认带完整 DWARF 调试符号，单个 libapp_lib.so 就有 147MB，
# 直接反映到 APK 体积上。剥掉符号后仍保留函数名（backtrace 照常可读），
# 实测 .so 从 147.5MB 降到 28.4MB。
[profile.dev]
strip = "debuginfo"

# 发布版全剥，.so 约 16MB
[profile.release]
strip = true
